name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/x10-adb-doctor-debug.apk x10-adb-doctor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: x10-adb-doctor
          path: |
            x10-adb-doctor.apk
            app/build/reports/lint-results-debug.html
